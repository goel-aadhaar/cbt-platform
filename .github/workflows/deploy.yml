name: Deploy

# Deploys are gated on CI rather than triggered directly by the push, so a
# commit that fails lint/typecheck/tests never reaches the server. CI already
# runs on every push to main; this waits for that run and acts only on a
# successful one.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Lets a failed deploy be retried, or a rollback pushed out, without an
  # empty commit.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. `cancel-in-progress: false` on purpose: a deploy that
# is midway through `prisma migrate deploy` must be allowed to finish rather
# than be killed with the schema half-applied.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    # Runs ON the production box. GitHub's hosted runners have no route to it
    # — port 22 is closed to everything but known addresses, and allowlisting
    # Actions is not an option (7,000+ CIDRs against a 60-rule security group
    # limit, rotated continuously). A self-hosted runner reaches GitHub
    # OUTBOUND instead, so nothing has to be opened at all.
    #
    # SECURITY, because this repo is public: a fork's pull request can propose
    # a workflow that targets this runner, and merely running it would execute
    # a stranger's code on the production host. Two things hold that shut, and
    # both must stay true:
    #   1. Settings > Actions > General > Fork pull request workflows must
    #      require approval from a maintainer.
    #   2. CI stays on `ubuntu-latest`. Only this deploy job — which never runs
    #      for a pull request — targets `self-hosted`.
    runs-on: [self-hosted, production]

    # Skip when CI failed or was cancelled. workflow_dispatch has no upstream
    # run, so it passes straight through.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    # Attach to a GitHub Environment so required reviewers or a wait timer can
    # be added later without touching this file.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    # A LOGIN shell. The runner service does not necessarily inherit the
    # profile that puts node/pnpm/pm2 on PATH, which is the usual way a deploy
    # that works by hand fails from CI with "pnpm: command not found".
    defaults:
      run:
        shell: bash -leo pipefail {0}

    steps:
      # No checkout: deploy.sh does its own `git pull` in the live working
      # copy, and checking out over the top of it would fight that.
      - name: Run the deploy script
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/codonmind' }}
        run: |
          cd "$DEPLOY_PATH"
          # Invoked via `bash` rather than `./scripts/deploy.sh` so the deploy
          # does not depend on the execute bit surviving a checkout.
          bash ./scripts/deploy.sh

      - name: Verify the API is answering
        # Catches pm2 reloading onto a process that then dies on boot, which
        # `pm2 status` alone reports as healthy.
        if: vars.HEALTH_URL != ''
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "$HEALTH_URL" > /dev/null; then
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i failed; retrying in 6s..."
            sleep 6
          done
          echo "API did not answer $HEALTH_URL after the reload." >&2
          exit 1
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
